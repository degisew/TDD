services:
    movies:
        build: .
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/usr/src/app/
        ports:
            - 8000:8000
        env_file:
            - ./.env.dev
        depends_on:
            - movies-db
    movies-db:
        image: postgres:16
        volumes:
        - postgres_data:/var/lib/postgresql/data/
        environment:
        - POSTGRES_USER=movies
        - POSTGRES_PASSWORD=movies
        - POSTGRES_DB=movies_dev

volumes:
  postgres_data: